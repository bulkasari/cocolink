name: Deploy web-react to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web-react/**'
      - '.github/workflows/deploy.yml'

# GitHub Pages 배포 권한 설정
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-react/package-lock.json

      - name: Install dependencies
        run: |
          cd web-react
          npm ci

      - name: Build project
        run: |
          cd web-react
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-react/dist
          branch: gh-pages
